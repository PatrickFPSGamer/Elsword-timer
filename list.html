<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combo Timer</title>
    <script defer src="list.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0;
            padding: 0;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            -webkit-app-region: drag;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .drag-handle {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 24px;
            background-color: rgba(0, 0, 0, 0.5);
            -webkit-app-region: drag;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            color: #ffffff;
            font-size: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
        }

        .drag-handle .title {
            font-weight: 500;
            color: #00ff00;
        }

        .drag-handle .controls {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }

        .control-button {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 12px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .control-button:hover {
            opacity: 1;
        }

        #comboList {
            margin-top: 20px;
            padding: 4px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
            flex: 1;
            margin-bottom: 20px;
            position: relative;
            height: calc(100vh - 24px); /* Fixed height */
            overflow: hidden; /* Hide scrollbars by default */
        }

        .combo-item {
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            -webkit-app-region: no-drag;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: absolute;
            cursor: move;
            user-select: none;
            z-index: 1;
            width: 200px;
        }

        .combo-item.dragging {
            opacity: 0.5;
            z-index: 1000;
        }

        .combo-header {
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-app-region: no-drag;
        }

        .title-image {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .status-container {
            display: flex;
            flex-direction: row;
            gap: 4px;
            flex: 1;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 3px;
            background-color: rgba(255, 255, 255, 0.05);
            flex: 1;
        }

        .status-label {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-right: 2px;
        }

        .status-value {
            font-family: 'Consolas', monospace;
            min-width: 40px;
            text-align: right;
        }

        .status-value.on {
            color: #00ff00;
        }

        .status-value.off {
            color: #ff0000;
        }

        @media (max-width: 600px) {
            #comboList {
                grid-template-columns: 1fr;
                padding: 8px;
            }

            .combo-item {
                padding: 12px;
            }
        }

        /* Add scrollbar styling only when needed */
        #comboList:hover {
            overflow-y: auto;
        }

        /* Custom scrollbar styling */
        #comboList::-webkit-scrollbar {
            width: 8px;
        }

        #comboList::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        #comboList::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        #comboList::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="drag-handle">
        <div class="title">Timer</div>
        <div class="controls">
            <button class="control-button" onclick="window.close()">Close</button>
        </div>
    </div>
    <div id="comboList">
        <!-- Combo items will be inserted here -->
    </div>
</body>
</html>
